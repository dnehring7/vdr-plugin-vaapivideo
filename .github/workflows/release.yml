#
# Build & sign RPMs (Fedora) and DEBs (Debian + Ubuntu), attach them to the
# GitHub Release, and publish DNF / APT repos via GitHub Pages.
#
# Prereqs:
#   Repo secret: GPG_PRIVATE_KEY (armored, unencrypted)

name: Build & Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag (vX.Y.Z)'
        required: true
        type: string
      publish:
        description: 'Upload to release & deploy Pages'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  PLUGIN: vaapivideo
  FEDORA_REL: '45'

# bash, not the containers' sh, and with -o pipefail: a failing curl in
# "curl | sed >> file" fails the step instead of writing a truncated file.
defaults:
  run:
    shell: bash

jobs:
  rpm:
    name: rpm (fedora 45)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container: fedora:45
    steps:
      - name: Install build prerequisites
        run: |
          dnf install -y "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-${FEDORA_REL}.noarch.rpm"
          dnf -y update
          dnf install -y git gnupg2 rpm-build rpm-sign rpmdevtools createrepo_c dnf5-plugins

      - name: Checkout tag source
        uses: actions/checkout@v7
        with:
          # Fully qualified: a branch named like the tag would win otherwise.
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Check version & install build deps
        run: |
          # The tarball is the tagged tree as committed, so it must already
          # carry the tag's version. Patching only the spec labeled the package
          # with the tag while the plugin reported its own version (v1.3.2).
          V=${TAG#v}
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            && [[ "$(awk '$1 == "Version:" {print $2}' "vdr-${PLUGIN}.spec")" == "${V}" ]] \
            && grep -qF "PLUGIN_VERSION = \"${V}\";" src/common.h \
            || { echo "::error::${TAG}, vdr-${PLUGIN}.spec and src/common.h must agree on vX.Y.Z"; exit 1; }
          echo "V=${V}" >> "${GITHUB_ENV}"
          dnf builddep -y "vdr-${PLUGIN}.spec"

      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build, sign & assemble repo
        env:
          KEYFP: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          git config --global --add safe.directory '*'
          rpmdev-setuptree
          git archive --format=tar.gz --prefix="vdr-plugin-${PLUGIN}-${V}/" HEAD \
            -o "${HOME}/rpmbuild/SOURCES/vdr-${PLUGIN}-${V}.tar.gz"
          # debug_package %{nil}: no -debuginfo / -debugsource subpackages.
          rpmbuild -ba --define 'debug_package %{nil}' "vdr-${PLUGIN}.spec"
          rpmsign --addsign --define "_gpg_name ${KEYFP}" \
            --define '_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback' \
            "${HOME}"/rpmbuild/RPMS/x86_64/*.rpm "${HOME}"/rpmbuild/SRPMS/*.rpm
          # Repo layout matches the baseurl of the .repo file:
          #   <pages>/fedora/<rel>/x86_64/{*.rpm, repodata/}
          REPO_DIR="repo/${FEDORA_REL}/x86_64"
          mkdir -p "${REPO_DIR}" pkgs
          cp "${HOME}"/rpmbuild/RPMS/x86_64/*.rpm "${REPO_DIR}/"
          createrepo_c "${REPO_DIR}/"
          gpg --batch --yes --pinentry-mode loopback --local-user "${KEYFP}" \
            --detach-sign --armor "${REPO_DIR}/repodata/repomd.xml"
          cp "${HOME}"/rpmbuild/RPMS/x86_64/*.rpm "${HOME}"/rpmbuild/SRPMS/*.rpm pkgs/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: |
            repo/
            pkgs/
          if-no-files-found: error
          retention-days: 7

  # Unsigned .debs only: the publish job builds the signed apt repos.
  deb:
    name: deb (${{ matrix.distro }} ${{ matrix.version }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            version: '13'
            codename: trixie
            image: debian:13
          - distro: ubuntu
            version: '26.04'
            codename: resolute
            image: ubuntu:26.04
    container: ${{ matrix.image }}
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            build-essential debhelper fakeroot dpkg-dev pkg-config \
            vdr-dev libdrm-dev libva-dev libasound2-dev \
            libavcodec-dev libavfilter-dev libavformat-dev \
            libavutil-dev libswresample-dev

      - name: Checkout tag source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Build .deb
        env:
          CODENAME: ${{ matrix.codename }}
        run: |
          # As in the rpm job: the changelog below labels the package with the
          # tag, so the tagged tree must report the same version.
          V=${TAG#v}
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            && grep -qF "PLUGIN_VERSION = \"${V}\";" src/common.h \
            || { echo "::error::${TAG} and src/common.h must agree on vX.Y.Z"; exit 1; }
          git config --global --add safe.directory '*'
          MAINTAINER=$(git log -1 --format='%an <%ae>' HEAD)
          cat > debian/changelog <<EOF
          vdr-plugin-${PLUGIN} (${V}+${CODENAME}1) ${CODENAME}; urgency=medium

            * Release ${V}

           -- ${MAINTAINER}  $(date -R)
          EOF
          chmod +x debian/rules
          DEB_BUILD_OPTIONS=noautodbgsym dpkg-buildpackage -us -uc -b
          mkdir -p _out && mv ../*.deb _out/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          # deb-<distro>-<codename> lets the publish job derive both fields
          # without a second copy of the matrix.
          name: deb-${{ matrix.distro }}-${{ matrix.codename }}
          path: _out/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [rpm, deb]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write   # gh release upload
    env:
      PKG: ${{ github.event.repository.name }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Install repo tools
        # The 26.04 image has no apt-utils (apt-ftparchive).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg

      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: _artifacts/

      - name: Stage Fedora repo
        run: |
          mkdir -p site
          cp -a _artifacts/rpm/repo/. site/fedora/

      - name: Build & sign apt repos
        env:
          KEYFP: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          for dir in _artifacts/deb-*; do
            tmp=${dir##*/deb-}              # <distro>-<codename>
            distro=${tmp%-*}; codename=${tmp##*-}
            REPO_DIR="site/${distro}"
            mkdir -p "${REPO_DIR}"
            cp "${dir}"/*.deb "${REPO_DIR}/"
            (
              cd "${REPO_DIR}"
              dpkg-scanpackages --arch amd64 . > Packages
              gzip -k Packages
              apt-ftparchive \
                -o APT::FTPArchive::Release::Origin="vdr-plugin-${PLUGIN}" \
                -o APT::FTPArchive::Release::Label="vdr-plugin-${PLUGIN}" \
                -o APT::FTPArchive::Release::Suite="${codename}" \
                -o APT::FTPArchive::Release::Codename="${codename}" \
                -o APT::FTPArchive::Release::Architectures="amd64" \
                release . > Release
              gpg --batch --yes --pinentry-mode loopback --local-user "${KEYFP}" \
                --detach-sign --armor -o Release.gpg Release
              gpg --batch --yes --pinentry-mode loopback --local-user "${KEYFP}" \
                --clearsign -o InRelease Release
            )
          done

      - name: Generate repo configs and landing page
        run: |
          # dnf fetches gpgkey on first install.
          cat > "site/fedora/${FEDORA_REL}/vdr-${PLUGIN}.repo" <<REPO
          [vdr-${PLUGIN}]
          name=${PKG} packages for Fedora ${FEDORA_REL}
          baseurl=${PAGES_URL}/fedora/${FEDORA_REL}/x86_64/
          enabled=1
          gpgcheck=1
          gpgkey=https://github.com/${GITHUB_REPOSITORY_OWNER}.gpg
          repo_gpgcheck=1
          REPO
          # DEB822 sources with an inline Signed-By, so the trust anchor travels
          # with the file: armored lines are space-prefixed, blank ones " .".
          for dir in _artifacts/deb-*; do
            d=${dir##*/deb-}; d=${d%-*}
            cat > "site/${d}/vdr-${PLUGIN}.sources" <<SOURCES
          Types: deb
          URIs: ${PAGES_URL}/${d}/
          Suites: ./
          Architectures: amd64
          Signed-By:
          SOURCES
            curl -fsSL "https://github.com/${GITHUB_REPOSITORY_OWNER}.gpg" \
              | sed -e 's/^$/./' -e 's/^/ /' \
              >> "site/${d}/vdr-${PLUGIN}.sources"
            printf '\n' >> "site/${d}/vdr-${PLUGIN}.sources"
          done
          cat > site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>${PKG} packages</title></head>
          <body>
          <h1>${PKG} ${TAG#v}</h1>

          <h2>Fedora ${FEDORA_REL} (x86_64)</h2>
          <pre>
          sudo dnf config-manager addrepo \\
            --from-repofile=${PAGES_URL}/fedora/${FEDORA_REL}/vdr-${PLUGIN}.repo
          sudo dnf install vdr-${PLUGIN}
          </pre>

          <h2>Debian 13 / Trixie (amd64)</h2>
          <pre>
          sudo curl -fsSL ${PAGES_URL}/debian/vdr-${PLUGIN}.sources \\
            -o /etc/apt/sources.list.d/vdr-${PLUGIN}.sources
          sudo apt update
          sudo apt install ${PKG}
          </pre>

          <h2>Ubuntu 26.04 LTS / Resolute Raccoon (amd64)</h2>
          <pre>
          sudo curl -fsSL ${PAGES_URL}/ubuntu/vdr-${PLUGIN}.sources \\
            -o /etc/apt/sources.list.d/vdr-${PLUGIN}.sources
          sudo apt update
          sudo apt install ${PKG}
          </pre>
          </body>
          </html>
          HTML

      - name: Upload packages to release
        # --clobber keeps a re-run idempotent; a tag without a release fails
        # here instead of getting one created behind its back.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${TAG}" --clobber \
            _artifacts/rpm/pkgs/*.rpm _artifacts/deb-*/*.deb

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  # A job of its own: deploy-pages finds the site in the run's artifact list,
  # which can lag the upload (the 1.10.1 publish failed with "No artifacts
  # named github-pages"), and a failed deploy re-runs alone.
  pages:
    name: pages
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
